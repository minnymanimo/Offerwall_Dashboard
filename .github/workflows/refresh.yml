name: Refresh offerwall dashboard data

on:
  schedule:
    - cron: '0 * * * *'   # 매시 정각(UTC)마다 실행 — 원본 데이터는 하루 한 번만 갱신되므로 충분히 여유 있는 주기
  workflow_dispatch:        # 저장소의 Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write   # data.json 등을 다시 커밋/푸시하려면 필요

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 구글 서비스 계정으로 시트를 읽을 때 필요한 패키지 (시트 비공개 대응)
      - name: Install packages
        run: pip install google-auth requests

      - name: Fetch sheet data and rebuild data.json / mobwith-a.json / mobwith-b.json
        env:
          # GitHub Settings > Secrets and variables > Actions 에 등록한 서비스 계정 키.
          # 아직 등록 전이면 빈 값이 들어가고, 그 경우 예전처럼 공개 링크로 읽는다.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/refresh_data.py

      - name: Commit updated JSON files (변경된 경우에만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json mobwith-a.json mobwith-b.json apcorn-ssp.json adop.json
          git diff --cached --quiet && echo "변경 사항 없음 — 커밋 생략" || git commit -m "데이터 자동 갱신 [skip ci]"
          git push
